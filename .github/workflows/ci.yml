name: CI

# Validate both halves of the app on every push and pull request:
#   - backend:  the FastAPI service + its pytest suite (Python 3.13)
#   - frontend: the Next.js app in web/ (lint, then a production build)
#
# Nothing here deploys. Deployment is handled separately — Vercel for the
# frontend (web/vercel.json) and a container host for the backend (Dockerfile).
# See DEPLOY.md for the runbook.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a run when a newer commit lands on the same ref, to save free-tier
# CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    # The ML dependencies (torch / faiss-cpu / sentence-transformers) are large,
    # so give the install + test run generous headroom on a cold pip cache.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # Mirrors the local invocation: pytest is run from the repo root, which
        # is the rootdir, so tests/ is discovered and `import app` resolves.
        # The suite mocks all LLM / embedding / network calls.
        run: pytest -q

  frontend:
    name: Frontend · lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # No npm cache here on purpose: the built-in cache needs a lockfile,
          # and web/ has none committed yet. Commit a package-lock.json and add
          # `cache: npm` + `cache-dependency-path: web/package-lock.json` later.

      - name: Install dependencies
        # `npm ci` requires a committed lockfile (none yet), so use install.
        # Versions in package.json are exact-pinned, keeping this deterministic.
        run: npm install --no-audit --no-fund

      - name: Lint
        # Non-blocking for now: the runner shouldn't be the source of lint truth
        # before a clean local `npm run lint` has been confirmed. Remove
        # continue-on-error to make lint a hard gate once it's verified green.
        continue-on-error: true
        run: npm run lint

      - name: Build
        # Authoritative gate: `next build` compiles and type-checks the app.
        # The NEXT_PUBLIC_* vars all have safe build-time defaults, so no
        # secrets are required to build.
        run: npm run build
