# Alembic configuration for the saved-library schema (Phase 11).
#
# The database URL is NOT hard-coded here — migrations/env.py pulls it from
# app.config (Settings.database_url, which honors the DATABASE_URL env var), so
# `alembic upgrade head` targets the same database the app uses, with no second
# place to keep in sync. SQLite locally; Supabase Postgres in production.

[alembic]
script_location = migrations
prepend_sys_path = .
# Use OS-native path separators for version files.
version_path_separator = os

# sqlalchemy.url is set programmatically in env.py (see above). Leave blank.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
